[package]
name = "ad_iced_builder"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.15.0-dev", features = [
    "tokio",
    "advanced",
    "debug",
    "canvas",
    "image",
    "svg",
    "markdown",
    "qr_code",
] }
iced_runtime = { version = "0.15.0-dev" }
# Fork of edwloef/iced_split, ported to iced master (upstream is pinned to
# iced_core 0.14 and only exists at 0.1.0).
iced_split = { path = "C:/Rust Projects/iced_split" }
#iced_split = { git = "https://github.com/A-Disruption/iced_split.git" }

widgets = { path = "C:/Rust Projects/widgets", features = [
    "collapsible",
    "tree",
    "color_picker_two",
    "menu",
    "popover",
    "layer",
    "toast",
    "date_picker",
] }
#widgets = { git = "https://github.com/A-Disruption/widgets.git", features = ["collapsible", "tree", "color_picker_two", "menu", "popover", "layer", "toast", "date_picker"] }

advanced-table = { path = "C:/Rust Projects/advanced-table" }
#advanced-table = { git = "https://github.com/A-Disruption/advanced-table.git" }

iced-native-frame = { path = "C:/Rust Projects/iced-window-decorations" }
#iced-native-frame = { git = "https://github.com/A-Disruption/iced-window-decorations.git" }

# The node-graph widget behind the action editor. Ported to iced master; the
# upstream targets 0.14.
iced_nodegraph = { path = "C:/Rust Projects/iced_nodegraph/iced_nodegraph" }
#iced_nodegraph = { git = "https://github.com/A-Disruption/iced_nodegraph.git" }

iced_lucide = { path = "C:/Rust Projects/testing/iced_lucide", features = ["all"] }
#iced_lucide = { git = "https://github.com/A-Disruption/iced_lucide.git", features = ["all"] }

uuid = { version = "1.21.0", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
rfd = "0.15"
tree_sitter_highlighter = { path = "C:/Rust Projects/tree_sitter_highlighter" }
#tree_sitter_highlighter = { git = "https://github.com/A-Disruption/tree_sitter_highlighter", branch = "master" }

[build-dependencies]
iced_lucide = { path = "C:/Rust Projects/testing/iced_lucide", features = ["all"] }

[features]
default = []
# The node-graph action editor. Parked until `flow_editor` is ported to
# iced master; the action *data model* and *code generation* stay compiled.
action_editor = []

# `iced` is asked for by version above and pointed at a source here, so every
# crate in the graph asking for `iced 0.15.0-dev` resolves to one checkout —
# which is what keeps `Element` and `Theme` one type across all of them.
# 0.15 is unreleased, so this block is not optional.
[patch.crates-io]
# Pinned rather than tracking `branch = "master"`: master has already moved
# past what this stack compiles against, and only the lockfile was holding it
# here. `iced_widget` and `iced_wgpu` are listed because `iced_nodegraph` asks
# for them by version -- cargo honours `[patch]` only in the manifest being
# built, so its own copy does nothing for us.
iced = { git = "https://github.com/iced-rs/iced.git", rev = "f728e14a571e2932bd2bee58d7d78ebd39a8422e" }
iced_runtime = { git = "https://github.com/iced-rs/iced.git", rev = "f728e14a571e2932bd2bee58d7d78ebd39a8422e" }
iced_widget = { git = "https://github.com/iced-rs/iced.git", rev = "f728e14a571e2932bd2bee58d7d78ebd39a8422e" }
iced_wgpu = { git = "https://github.com/iced-rs/iced.git", rev = "f728e14a571e2932bd2bee58d7d78ebd39a8422e" }
